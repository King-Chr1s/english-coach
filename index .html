<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>English Coach</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="English Coach" />
<meta name="theme-color" content="#0F2E29" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --pine:#0F2E29;--pine2:#183F38;--pine3:#0C2723;--line:#2B5C53;--line2:#1E4740;
    --bone:#EDE6D6;--mint:#BFDCCE;--dim:#6E9A8C;--dim2:#8FB6A8;--amber:#E9B23C;--coral:#E4735F;--sky:#7FB2C9;
    --nav: calc(60px + env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--pine);}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--mint);display:flex;flex-direction:column;overflow:hidden;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .mono{font-family:'DM Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;font-size:10px;}
  .disp{font-family:'Fraunces','Georgia',serif;}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);flex-shrink:0;}
  header h1{margin:0;font-size:19px;color:var(--bone);font-weight:600;display:flex;align-items:baseline;gap:8px;}
  header h1 .ver{font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.05em;}
  header .sub{color:var(--dim);}
  .hstats{display:flex;gap:12px;color:var(--dim);align-items:center;}
  .hstats b{color:var(--amber);font-weight:500;}

  #screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .pad{padding:24px 18px calc(26px + var(--nav));max-width:660px;margin:0 auto;width:100%;}
  .pad h2{font-family:'Fraunces',Georgia,serif;color:var(--bone);font-size:25px;margin:6px 0 10px;font-weight:400;line-height:1.3;}
  .pad p{color:var(--dim2);font-size:14px;line-height:1.6;margin:0 0 20px;}
  .lead{color:var(--dim);}

  .cta{background:var(--amber);color:#12302B;border-radius:10px;padding:14px 20px;font-weight:600;font-size:15px;width:100%;}
  .cta:disabled{opacity:.4;}
  .ghost{border:1px solid var(--line);border-radius:10px;padding:12px 18px;font-size:14px;color:var(--mint);}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row>*{flex:1;}

  .tiles{display:grid;gap:10px;}
  .tile{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;color:var(--bone);display:flex;flex-direction:column;gap:4px;transition:.15s;}
  .tile:active{background:#173C35;}
  .tile b{font-size:16px;}
  .tile span{color:var(--dim);font-size:12px;}
  .tile .k{font-family:'DM Mono',monospace;font-size:10px;color:var(--amber);text-transform:uppercase;letter-spacing:.08em;}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px;}
  .chip{border:1px solid var(--line);border-radius:18px;padding:7px 13px;font-size:13px;color:var(--dim2);}
  .chip.on{background:var(--amber);color:#12302B;border-color:var(--amber);font-weight:600;}

  label.f{display:block;margin:0 0 16px;}
  label.f span{display:block;color:var(--dim);margin-bottom:6px;}
  input.f,select.f{width:100%;background:#173C35;border:1px solid var(--line);border-radius:9px;color:var(--bone);padding:12px 13px;font-family:inherit;font-size:15px;}
  textarea{resize:none;background:#173C35;border:1px solid var(--line);border-radius:9px;color:var(--bone);padding:11px 13px;font-family:inherit;font-size:15px;line-height:1.45;}

  .goal{display:flex;align-items:center;gap:14px;background:#12332E;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:22px;}
  .ring{width:52px;height:52px;flex-shrink:0;}
  .ring circle{fill:none;stroke-width:5;}
  .ring .bg{stroke:var(--line2);}
  .ring .fg{stroke:var(--amber);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .4s;}
  .goal .txt b{color:var(--bone);font-size:15px;}
  .goal .txt div{color:var(--dim);font-size:12px;margin-top:2px;}
  .goal.done{border-color:var(--amber);}

  /* exercise */
  .exq{background:var(--pine2);border:1px solid var(--line);border-radius:14px;padding:22px 18px;margin-bottom:16px;}
  .exq .tag{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);margin-bottom:12px;}
  .exq .sent{font-family:'Fraunces',Georgia,serif;font-size:21px;color:var(--bone);line-height:1.5;}
  .exq .blank{display:inline-block;min-width:70px;border-bottom:2px dashed var(--amber);color:var(--amber);text-align:center;padding:0 6px;}
  .exq .clue{color:var(--dim2);font-size:13px;margin-top:12px;}
  .exin{width:100%;margin:0 0 14px;font-size:16px;}
  .verdict{border-radius:12px;padding:14px 16px;margin-bottom:16px;}
  .verdict.ok{background:#1C3F2E;border:1px solid #3E8E5F;}
  .verdict.no{background:#3A2420;border:1px solid #8E4A3E;}
  .verdict .head{font-weight:600;margin-bottom:8px;color:var(--bone);}
  .verdict .sol{font-family:'Fraunces',Georgia,serif;font-size:19px;color:var(--mint);}
  .verdict .note{color:var(--dim2);font-size:13px;margin-top:8px;line-height:1.5;}
  .verdict .tr{color:var(--dim);font-size:12px;margin-top:6px;font-style:italic;}
  .exstat{display:flex;gap:16px;color:var(--dim);font-size:12px;margin-bottom:18px;font-family:'DM Mono',monospace;}
  .exstat b{color:var(--amber);}

  /* reading */
  .read{background:var(--pine2);border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-bottom:16px;}
  .read h3{font-family:'Fraunces',Georgia,serif;color:var(--bone);font-size:20px;margin:0 0 12px;font-weight:400;}
  .read .body{font-size:15px;line-height:1.7;color:var(--mint);}
  .read .body .kw{color:var(--amber);cursor:help;border-bottom:1px dotted var(--amber);}
  .qcard{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  .qcard .qh{color:var(--bone);font-size:15px;margin-bottom:12px;line-height:1.45;}
  .qopts{display:grid;gap:7px;}
  .qopts button{background:#173C35;border:1px solid var(--line);color:var(--bone);padding:11px 13px;border-radius:9px;text-align:left;font-size:14px;}
  .qopts button.sel{border-color:var(--amber);}
  .qopts button.good{background:#1C3F2E;border-color:#3E8E5F;}
  .qopts button.bad{background:#3A2420;border-color:#8E4A3E;}

  .badge{display:inline-flex;align-items:baseline;gap:8px;background:var(--bone);color:#0F2E29;border-radius:10px;padding:9px 16px;font-family:'Fraunces',Georgia,serif;font-size:32px;margin-bottom:18px;}
  .badge small{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#5A6D66;}
  .axis{margin-bottom:14px;}
  .axis .r{color:var(--dim);display:flex;justify-content:space-between;margin-bottom:6px;}
  .bar{height:8px;background:var(--line2);border-radius:5px;overflow:hidden;}
  .bar>span{display:block;height:100%;background:var(--amber);}
  .bar.mint>span{background:var(--mint);}
  .prog{display:flex;gap:3px;margin-bottom:24px;}
  .prog i{flex:1;height:3px;border-radius:2px;background:#22514F;}
  .prog i.on{background:var(--amber);}
  .q{font-family:'Fraunces',Georgia,serif;font-size:22px;color:var(--bone);line-height:1.45;margin:0 0 22px;}
  .opts{display:grid;gap:8px;}
  .opts button{background:#173C35;border:1px solid var(--line);color:var(--bone);padding:14px 15px;border-radius:10px;text-align:left;font-size:16px;}
  .opts button:active{border-color:var(--amber);}
  .prio{list-style:none;padding:0;margin:0 0 22px;}
  .prio li{border-left:2px solid var(--amber);padding:4px 0 4px 12px;margin-bottom:10px;color:var(--bone);font-size:14px;line-height:1.5;}
  .card{background:var(--bone);color:#123029;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
  .card .mono{color:#7A8B84;}
  .wrong{font-size:14px;color:#9B4436;text-decoration:line-through;text-decoration-color:var(--coral);text-decoration-thickness:1.5px;}
  .right{font-family:'Fraunces',Georgia,serif;font-size:17px;color:#0F2E29;line-height:1.35;}
  .cnote{font-size:12px;color:#5A6D66;font-family:'DM Mono',monospace;}

  .chatwrap{display:flex;flex-direction:column;height:100%;}
  .chatscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px;display:flex;flex-direction:column;gap:16px;}
  .turn{display:flex;flex-direction:column;gap:8px;max-width:88%;}
  .learner{align-self:flex-end;align-items:flex-end;}
  .tutor{align-self:flex-start;}
  .bubble{padding:11px 14px;border-radius:13px;font-size:15px;line-height:1.55;}
  .learner .bubble{background:var(--bone);color:#123029;border-bottom-right-radius:3px;}
  .tutor .bubble{background:var(--pine2);border:1px solid var(--line);border-bottom-left-radius:3px;}
  .say{color:var(--dim);padding:2px 6px 2px 0;display:inline-flex;align-items:center;gap:5px;}
  .say svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;}
  .say.on{color:var(--amber);}
  .fr{color:var(--dim);padding:2px 0;text-align:left;}
  .metarow{display:flex;gap:12px;align-items:center;}
  .frtext{font-size:13px;color:var(--dim2);line-height:1.5;border-left:2px solid var(--line);padding-left:10px;}
  .upx{background:#22514833;border:1px dashed var(--amber);border-radius:10px;padding:10px 13px;}
  .upx b{color:var(--amber);font-weight:500;font-size:14px;display:block;}
  .upx span{display:block;color:var(--dim2);font-size:12px;margin-top:3px;}
  .compose{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;flex-shrink:0;}
  .compose textarea{flex:1;min-height:46px;max-height:140px;}
  .mic{background:#173C35;border:1px solid var(--line);color:var(--mint);border-radius:9px;padding:12px;flex-shrink:0;}
  .mic.rec{background:var(--coral);color:#fff;border-color:var(--coral);}
  .mic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;display:block;}
  .send{background:var(--amber);color:#12302B;border-radius:9px;padding:12px 16px;font-weight:600;font-size:14px;flex-shrink:0;}
  .send:disabled{opacity:.4;}
  .dots{color:var(--dim);font-size:14px;padding:4px 2px;}
  .err{color:var(--coral);font-size:13px;padding:10px 0;}
  .empty{color:#4F7268;font-size:13px;line-height:1.6;}
  .item{border-bottom:1px solid var(--line2);padding-bottom:12px;margin-bottom:12px;}
  .item .right{color:var(--bone);font-size:15px;}
  .item .wrong{color:#B4715F;font-size:12px;}
  .seg{display:flex;gap:8px;margin-bottom:16px;}
  .seg button{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px;color:var(--dim);}
  .seg button.on{color:var(--amber);border-color:var(--amber);}
  .flash{background:var(--pine2);border:1px solid var(--line);border-radius:14px;padding:26px 20px;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:14px;margin-bottom:18px;}
  .flash .ctx{color:var(--dim);font-size:13px;}
  .flash .front{font-family:'Fraunces',Georgia,serif;font-size:22px;color:var(--bone);line-height:1.4;}
  .flash .back{border-top:1px solid var(--line);padding-top:14px;}
  .flash .back .right{color:var(--mint);}
  .flash .back .cnote{color:var(--dim);}

  nav{display:flex;flex-shrink:0;border-top:1px solid var(--line);background:var(--pine3);padding-bottom:env(safe-area-inset-bottom);}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;color:var(--dim);font-size:9.5px;}
  nav button.on{color:var(--amber);}
  nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;}

  .toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px);transform:translateX(-50%);background:var(--amber);color:#12302B;
    padding:11px 18px;border-radius:22px;font-weight:600;font-size:14px;z-index:20;box-shadow:0 6px 20px #0006;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
  <header>
    <div>
      <div class="sub mono" id="hsub">Laboratoire de langue</div>
      <h1 class="disp">English Coach <span class="ver" id="hver">v3</span></h1>
    </div>
    <div class="hstats mono">
      <span>🔥 <b id="hstreak">0</b></span>
      <span>Jours <b id="hdays">0</b></span>
    </div>
  </header>

  <div id="screen"><div class="scroll"><div class="pad"><p class="lead">Chargement…</p></div></div></div>
  <div class="toast" id="toast"></div>

  <nav id="nav" style="display:none">
    <button data-nav="coach"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 01-9 8.4L3 21l1.1-3.3A8.4 8.4 0 1121 11.5z"/></svg>Coach</button>
    <button data-nav="drill"><svg viewBox="0 0 24 24"><path d="M12 20V10M6 20v-6M18 20V6"/></svg>Exercices</button>
    <button data-nav="reading"><svg viewBox="0 0 24 24"><path d="M4 5h7v15H6a2 2 0 01-2-2zM20 5h-7v15h5a2 2 0 002-2z"/></svg>Lecture</button>
    <button data-nav="notebook"><svg viewBox="0 0 24 24"><path d="M6 4h11a2 2 0 012 2v14l-3-2-3 2-3-2-3 2V6a2 2 0 012-2z"/></svg>Carnet</button>
    <button data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></svg>Réglages</button>
  </nav>

<script>
"use strict";
var VERSION="v3";

/* ---------------- persistence ---------------- */
var KEY="encoach:v3", OLD2="encoach:v2", OLD1="encoach:v1";
var state={
  groqKey:"", model:"openai/gpt-oss-120b",
  profile:null,
  notebook:{ corrections:[], expressions:[] },
  log:{}, goal:3, speak:true,
  stats:{ conj:{r:0,w:0}, gram:{r:0,w:0}, voc:{r:0,w:0} }
};
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){ state=Object.assign(state, JSON.parse(r)); return; }
    var prev=localStorage.getItem(OLD2)||localStorage.getItem(OLD1);
    if(prev){
      var s=JSON.parse(prev);
      state=Object.assign(state,{ groqKey:s.groqKey||"", model:s.model||state.model, profile:s.profile||null,
        notebook:s.notebook||state.notebook, log:s.log||{}, goal:s.goal||3, speak:s.speak!==false });
      (s.days||[]).forEach(function(d){ state.log[d]=state.log[d]||1; });
      save();
    }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* ---------------- exercise modules ---------------- */
var MODULES={
  conj:{ label:"Conjugaison", k:"Temps, formes, irréguliers",
    focuses:["Auto","Présent simple","Présent continu","Prétérit","Present perfect","Past perfect","Futur (will/going to)","Conditionnel","Verbes irréguliers","Modaux"] },
  gram:{ label:"Grammaire", k:"Structure de la phrase",
    focuses:["Auto","Prépositions","Articles (a/the)","Pronoms relatifs","Comparatifs & superlatifs","Conditionnels (if)","Discours indirect","Question tags","Quantifieurs"] },
  voc:{ label:"Vocabulaire", k:"Mots en contexte",
    focuses:["Auto","Travail / IT","Voyage","Vie quotidienne","Économie / finance","Phrasal verbs","Faux-amis"] }
};
function exercisePrompt(mod, focus, level){
  var base="You create exactly ONE short English fill-in-the-blank exercise for a French native speaker at CEFR level "+level+". "
    +"One natural, useful sentence with exactly one blank. ";
  var spec="";
  if(mod==="conj") spec="Test verb CONJUGATION"+(focus&&focus!=="Auto"?(" — target: "+focus):"")+". The blank is a verb to put in the right form. The clue_fr must give the infinitive, e.g. \"(to go)\".";
  if(mod==="gram") spec="Test a GRAMMAR point"+(focus&&focus!=="Auto"?(" — target: "+focus):"")+". The blank tests grammar (preposition, article, relative pronoun, comparative, etc.). The clue_fr names the point in French.";
  if(mod==="voc") spec="Test VOCABULARY"+(focus&&focus!=="Auto"?(" — theme: "+focus):"")+". The blank is one content word. The clue_fr gives the French meaning of the expected word.";
  return base+spec+"\n\nRespond with a raw JSON object and NOTHING else:\n"
    +'{ "before":string (text before the blank, may be empty), "after":string (text after the blank, may be empty), '
    +'"answer":string (the exact expected word/phrase for the blank), "alts":[string] (accepted variants, may be empty), '
    +'"clue_fr":string (short French clue), "tag":string (short English label of what is tested), '
    +'"translation_fr":string (French translation of the full sentence), "explain_fr":string (French, max 22 words, why this answer) }';
}
function norm(s){ return String(s||"").toLowerCase().trim().replace(/\s+/g," ").replace(/[.,;!?'"]+$/,"").replace(/^['"]+/,""); }
function checkAnswer(it, user){
  var u=norm(user); if(!u) return false;
  if(u===norm(it.answer)) return true;
  return (it.alts||[]).some(function(a){ return norm(a)===u; });
}

/* ---------------- content: placement test ---------------- */
var QUESTIONS=[
  { q:"She ___ to the office every morning.", a:["goes","go","going","is go"], k:0 },
  { q:"I ___ my keys yesterday.", a:["lost","have lost","lose","was losing"], k:0 },
  { q:"There ___ a lot of people in the meeting.", a:["were","was","is","has"], k:0 },
  { q:"He is good ___ solving problems.", a:["at","in","for","on"], k:0 },
  { q:"I have worked here ___ 2019.", a:["since","for","during","from"], k:0 },
  { q:"If the client calls, I ___ him the invoice.", a:["will send","would send","send","sent"], k:0 },
  { q:"She asked me ___ the report.", a:["to check","that I check","checking","check"], k:0 },
  { q:"I am used ___ with international teams.", a:["to working","to work","working","work"], k:0 },
  { q:"The system ___ updated last night.", a:["was","is","has","were"], k:0 },
  { q:"___ I known about the bug, I would have escalated it.", a:["Had","If","Have","Should"], k:0 },
  { q:"He denied ___ the file.", a:["deleting","to delete","delete","that delete"], k:0 },
  { q:"It is the kind of issue ___ takes hours to reproduce.", a:["that","what","which it","who"], k:0 },
  { q:"I would rather you ___ the client directly.", a:["contacted","contact","to contact","contacting"], k:0 },
  { q:"No sooner ___ the patch than the server crashed.", a:["had we deployed","we had deployed","we deployed","did we deploy"], k:0 },
  { q:"The report, ___ conclusions were disputed, was withdrawn.", a:["whose","which","that its","of which"], k:0 }
];
var PROD_TASK="Describe a problem you solved at work recently: what went wrong, what you did, and how it ended.";
var LEVELS=["A2","B1","B2","C1"];
var TONE={
  A2:"Speak at A2-B1 level: short sentences, very frequent vocabulary, present and past simple, no idioms. Reply in 2-3 short sentences.",
  B1:"Speak at B1-B2 level: natural everyday English, contractions, common phrasal verbs. Reply in 2-4 sentences.",
  B2:"Speak at B2-C1 level: richer vocabulary, idiomatic but not obscure. Reply in 3-4 sentences.",
  C1:"Speak at C1 level: nuance, varied register, real idiom. Challenge the learner's positions."
};
var SCENARIOS=[
  { id:"support", label:"Support client", hint:"Tu gères un ticket en anglais", brief:"Roleplay: the learner works in software support for accounting professionals. You are an English-speaking client with a software issue. Stay in character and be realistic." },
  { id:"interview", label:"Entretien", hint:"Consultant fonctionnel", brief:"Roleplay: you are a hiring manager interviewing the learner for a functional consultant role on accounting or ERP software. One question per turn." },
  { id:"meeting", label:"Réunion", hint:"Priorités, blocages", brief:"Roleplay: you are a colleague in an international team meeting. Discuss priorities, deadlines and blockers. Push the learner to disagree and propose." },
  { id:"debate", label:"Débat", hint:"Économie, marchés, tech", brief:"Roleplay: you are a sharp but friendly debate partner on economics, markets or technology. Take a position and ask the learner to defend theirs." },
  { id:"free", label:"Discussion libre", hint:"Sport, voyage, quotidien", brief:"Roleplay: you are a friendly English-speaking acquaintance chatting about everyday life, sport and travel." }
];
var READING_THEMES=["Travail / IT","Voyage","Actualité tech","Vie quotidienne","Économie","Culture"];

/* ---------------- helpers ---------------- */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function todayKey(){ return new Date().toISOString().slice(0,10); }
function activeDays(){ return Object.keys(state.log).filter(function(d){ return state.log[d]>0; }); }
function streakOf(){
  var set=state.log, n=0, d=new Date();
  if(!set[todayKey()]) d.setDate(d.getDate()-1);

  return n;
}

var voices=[], speechUnlocked=false, speakingId=null;
function loadVoices(){ try{ voices=window.speechSynthesis?speechSynthesis.getVoices():[]; }catch(e){ voices=[]; } }
function pickVoice(){
  if(!voices.length) loadVoices();

  return en.filter(function(v){return /US/i.test(v.lang);})[0]||en.filter(function(v){return /GB/i.test(v.lang);})[0]||en[0]||null;
}

/* ---------------- Groq ---------------- */
function extractJSON(txt){
  var t=String(txt).replace(/```json|```/g,"").trim();
  try{ return JSON.parse(t); }catch(e){}
  var i=t.indexOf("{"), j=t.lastIndexOf("}");
  if(i>=0&&j>i) return JSON.parse(t.slice(i,j+1));
  throw new Error("bad json");
}
function groqCall(system, msgs, forceJSON){
  var body={ model:state.model, messages:[{role:"system",content:system}].concat(msgs), temperature:0.7, max_tokens:1400 };
  if(forceJSON) body.response_format={type:"json_object"};
  return fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST", headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+state.groqKey }, body:JSON.stringify(body)
  }).then(function(res){
    if(!res.ok){ return res.text().then(function(t){ throw new Error("HTTP "+res.status+" "+t.slice(0,100)); }); }
    return res.json();
  }).then(function(data){ return extractJSON(data.choices[0].message.content); });
}

    "Discuss it together in English. Ask for the learner's opinion, push them to use new words from the text. Start with: "+(d.discuss||"What did you think of this text?");
  rd.phase="pick";
  startCustom(brief, "Let's discuss the text we just read. "+(d.discuss||"What did you think of it?"));
}
function resetReading(){ rd.phase="pick"; rd.data=null; renderReading(); }

/* ---------------- test ---------------- */
var qi=0, answers=[], prod="", phase="mcq", testErr="";
function renderTest(){
  var html='<div class="scroll"><div class="pad"><div class="prog">';
  for(var i=0;i<QUESTIONS.length;i++){ html+='<i class="'+(i<answers.length?"on":"")+'"></i>'; }
  html+='</div>';
  if(phase==="mcq"){
    var Q=QUESTIONS[qi];
    html+='<span class="mono lead">Structure · '+(qi+1)+' / '+QUESTIONS.length+'</span><p class="q">'+esc(Q.q)+'</p><div class="opts">';
    Q.a.forEach(function(opt,idx){ html+='<button onclick="App.answerTest('+idx+')">'+esc(opt)+'</button>'; });
    html+='</div>';
  }else if(phase==="prod"){
    html+='<span class="mono lead">Production · dernière étape</span><h2>Écris quatre ou cinq phrases.</h2>'+
      '<p>'+esc(PROD_TASK)+'<br>Sans traducteur : c\'est ce qui mesure ton vrai niveau.</p>'+
      '<textarea id="pin" style="width:100%;min-height:150px;margin-bottom:14px" placeholder="Write here, in English."></textarea>';
    if(testErr) html+='<div class="err">'+esc(testErr)+'</div>';
    html+='<button class="cta" id="pbtn" onclick="App.submitTest()">Voir mon bilan</button><p class="mono lead" id="phint" style="margin-top:12px"></p>';
  }else if(phase==="scoring"){ html+='<p class="dots">Correction en cours ···</p>'; }
  html+='</div></div>'; set(html);
  var pin=document.getElementById("pin");
  if(pin){ pin.value=prod; var upd=function(){ prod=pin.value; var n=prod.trim()?prod.trim().split(/\s+/).length:0; document.getElementById("pbtn").disabled=n<15; document.getElementById("phint").textContent=n<15?("Encore quelques mots ("+n+"/15)"):""; }; pin.addEventListener("input",upd); upd(); }
}
function answerTest(idx){ answers.push(idx); if(qi+1<QUESTIONS.length){ qi++; } else { phase="prod"; } renderTest(); }
function gradeStructure(ans){
  var c=0; QUESTIONS.forEach(function(q,i){ if(ans[i]===q.k) c++; });
  var level="A2"; if(c>=13) level="C1"; else if(c>=11) level="B2"; else if(c>=8) level="B1";
  return { correct:c, pct:Math.round(c/QUESTIONS.length*100), level:level };
}
function submitTest(){
  phase="scoring"; testErr=""; renderTest();
  var structure=gradeStructure(answers);
  var sys="Assess the written English of a French native speaker against the CEFR. Respond with a raw JSON object only:\n"+
    '{ "production_level":"A2"|"B1"|"B2"|"C1", "patterns":[{"label":string,"example":string,"fix":string}] (max 3, French labels), "priorities":[string,string,string] (French), "comment":string (French, 2 sentences) }';
  groqCall(sys,[{role:"user",content:"Task: "+PROD_TASK+"\n\nAnswer:\n"+prod}],true).then(function(p){
    var pi=LEVELS.indexOf(p.production_level); if(pi<0) pi=1;
    var si=LEVELS.indexOf(structure.level);
    var overall=Math.max(0,Math.round((pi+si)/2));
    var result={ structure:structure, production:LEVELS[pi], patterns:p.patterns||[], priorities:p.priorities||[], comment:p.comment||"", level:LEVELS[overall], date:todayKey() };
    state.profile={ level:result.level, last:result }; save(); current="testResult"; render();
  }).catch(function(e){ testErr="Bilan non corrigé ("+e.message+"). Réessaie."; phase="prod"; renderTest(); });
}
function renderResult(){
  var res=state.profile&&state.profile.last;
  if(!res||!res.structure){ current="drill"; return renderDrill(); }
  var html='<div class="scroll"><div class="pad"><span class="mono lead">Bilan du '+esc(res.date)+'</span>'+
    '<div class="badge" style="margin-top:10px">'+esc(res.level)+' <small>niveau global</small></div>'+
    '<div class="axis"><div class="r mono"><span>Structure</span><span>'+res.structure.correct+'/15 · '+res.structure.level+'</span></div><div class="bar"><span style="width:'+res.structure.pct+'%"></span></div></div>';
  var pw=((LEVELS.indexOf(res.production)+1)/LEVELS.length)*100;
  html+='<div class="axis"><div class="r mono"><span>Production</span><span>'+esc(res.production)+'</span></div><div class="bar mint"><span style="width:'+pw+'%"></span></div></div>';
  if(res.comment) html+='<p style="margin-top:18px">'+esc(res.comment)+'</p>';
  if(res.patterns&&res.patterns.length){ html+='<span class="mono lead">Ce qui revient</span><div style="display:grid;gap:10px;margin:10px 0 22px">';
    res.patterns.forEach(function(p){ html+='<div class="card"><span class="mono">'+esc(p.label)+'</span><span class="wrong">'+esc(p.example)+'</span><span class="right">'+esc(p.fix)+'</span></div>'; }); html+='</div>'; }
  if(res.priorities&&res.priorities.length){ html+='<span class="mono lead">Par quoi commencer</span><ul class="prio" style="margin-top:10px">';
    res.priorities.forEach(function(p){ html+='<li>'+esc(p)+'</li>'; }); html+='</ul>'; }
  html+='<button class="cta" onclick="App.go(\'drill\')">Aller aux exercices</button></div></div>'; set(html);
}

/* ---------------- notebook + review ---------------- */
var nbTab="corrections";
function renderNotebook(){
  var n=state.notebook;
  var html='<div class="scroll"><div class="pad"><span class="mono lead">Carnet</span><h2>Tes erreurs, à revoir.</h2>';
  if(n.corrections.length) html+='<div class="row" style="margin-bottom:18px"><button class="cta" onclick="App.startReview()">Réviser ('+n.corrections.length+')</button><button class="ghost" onclick="App.exportAnki()">Export Anki</button></div>';
  html+='<div class="seg"><button class="'+(nbTab==="corrections"?"on":"")+'" onclick="App.nb(\'corrections\')">Corrections ('+n.corrections.length+')</button><button class="'+(nbTab==="expressions"?"on":"")+'" onclick="App.nb(\'expressions\')">Expressions ('+n.expressions.length+')</button></div>';
  if(nbTab==="corrections"){
    if(!n.corrections.length) html+='<p class="empty">Vide pour l\'instant. Fais un exercice ou parle au coach — les erreurs atterrissent ici.</p>';
    else n.corrections.forEach(function(c){ html+='<div class="item"><div class="wrong">'+esc(c.original)+'</div><div class="right">'+esc(c.fixed)+'</div><div class="cnote lead">'+esc(c.note)+'</div></div>'; });
  }else{
    if(!n.expressions.length) html+='<p class="empty">Les expressions proposées par le coach s\'archivent ici.</p>';
    else n.expressions.forEach(function(e){ html+='<div class="item"><div class="right">'+esc(e.phrase)+'</div><div class="cnote lead">'+esc(e.meaning)+'</div></div>'; });
  }
  html+='</div></div>'; set(html);
}
var rev={ queue:[], i:0, revealed:false };
function startReview(){
  var items=state.notebook.corrections.slice();
  items.sort(function(a,b){ return (a.seen||0)-(b.seen||0); });
  rev={ queue:items.slice(0,20), i:0, revealed:false };
  if(!rev.queue.length){ toast("Rien à réviser"); return; }
  current="review"; render();
}
function renderReview(){
  var q=rev.queue[rev.i];
  if(!q){ set('<div class="scroll"><div class="pad"><span class="mono lead">Révision</span><h2>Session terminée.</h2><p>Tu as revu '+rev.queue.length+' fiche'+(rev.queue.length>1?"s":"")+'. Reviens demain : c\'est la répétition espacée qui ancre.</p><button class="cta" onclick="App.go(\'notebook\')">Retour au carnet</button></div></div>'); return; }
  var html='<div class="scroll"><div class="pad"><span class="mono lead">Révision · '+(rev.i+1)+' / '+rev.queue.length+'</span>'+
    '<div class="flash"><div class="ctx">Corrige cette phrase</div><div class="front">'+esc(q.original)+'</div>';
  if(rev.revealed) html+='<div class="back"><div class="right">'+esc(q.fixed)+'</div><div class="cnote">'+esc(q.note)+'</div></div>';
  html+='</div>';
  if(!rev.revealed) html+='<button class="cta" onclick="App.reveal()">Révéler</button>';
  else html+='<div class="row"><button class="ghost" onclick="App.grade(0)">À revoir</button><button class="cta" onclick="App.grade(1)">Acquis</button></div>';
  html+='</div></div>'; set(html);
}
function reveal(){ rev.revealed=true; renderReview(); }
function grade(ok){ var q=rev.queue[rev.i]; if(q){ q.seen=(q.seen||0)+(ok?2:1); save(); } rev.i++; rev.revealed=false; renderReview(); }
function exportAnki(){
  var lines=[];
  state.notebook.corrections.forEach(function(c){ lines.push(["Corrige : "+c.original, c.fixed+(c.note?("  —  "+c.note):"")].join("\t")); });
  state.notebook.expressions.forEach(function(e){ lines.push([e.phrase, e.meaning||""].join("\t")); });
  if(!lines.length){ toast("Carnet vide"); return; }
  var blob=new Blob([lines.join("\n")],{type:"text/tab-separated-values"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a"); a.href=url; a.download="english-coach-anki.txt"; document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },500);
  toast("Fichier Anki généré ("+lines.length+" cartes)");
}

/* ---------------- settings ---------------- */
function renderSettings(){
  var lvl=state.profile?state.profile.level:"—";
  set('<div class="scroll"><div class="pad"><span class="mono lead">Réglages</span><h2>Paramètres.</h2>'+
    '<label class="f"><span>Clé API Groq</span><input class="f" id="sKey" type="password" value="'+esc(state.groqKey)+'" autocomplete="off" /></label>'+
    '<label class="f"><span>Modèle</span><input class="f" id="sModel" value="'+esc(state.model)+'" /></label>'+
    '<label class="f"><span>Objectif quotidien (activités)</span><input class="f" id="sGoal" type="number" min="1" max="30" value="'+state.goal+'" /></label>'+
    '<label class="f" style="display:flex;align-items:center;gap:10px"><input type="checkbox" id="sSpeak" '+(state.speak?"checked":"")+' style="width:auto"/> <span style="margin:0">Lecture à voix haute des réponses</span></label>'+
    '<button class="cta" id="setbtn" onclick="App.saveSettings()">Enregistrer</button>'+
    '<div style="height:24px"></div><span class="mono lead">Niveau · '+esc(lvl)+'</span><p style="margin-top:8px">Le bilan cale la difficulté des exercices, de la lecture et du coach.</p>'+
    '<button class="ghost" style="width:100%" onclick="App.startTest()">'+(state.profile?"Repasser le bilan":"Passer le bilan")+'</button>'+
    '<div style="height:24px"></div><span class="mono lead">Oral</span><p style="margin-top:8px">La lecture marche partout. Pour parler, le micro utilise la dictée du navigateur si dispo ; sur iPhone, préfère le micro du clavier iOS.</p>'+
    '<span class="mono lead">Données</span><p style="margin-top:8px">Tout est stocké sur cet appareil.</p>'+
    '<button class="ghost" style="width:100%;color:var(--coral);border-color:#5a3630" onclick="App.wipe()">Tout effacer</button>'+
    '<p class="mono lead" style="margin-top:24px">Version '+VERSION+' · modèle défaut openai/gpt-oss-120b · modèles actifs sur console.groq.com/docs/models</p></div></div>');
}

/* ---------------- actions ---------------- */
var App={
  go:go,
  saveKey:function(){ var k=document.getElementById("kInput").value.trim(), m=document.getElementById("mInput").value.trim(); if(!k){ document.getElementById("kInput").focus(); return; } state.groqKey=k; if(m) state.model=m; save(); current="coach"; render(); },
  skipTest:function(){ state.profile={ level:"B1", last:{date:"estimé",level:"B1",structure:null,production:"B1"} }; save(); render(); },
  startTest:function(){ qi=0; answers=[]; prod=""; phase="mcq"; testErr=""; current="test"; render(); },
  answerTest:answerTest, submitTest:submitTest,
  start:start, send:send, mic:toggleMic, say:sayMsg, toggleFr:toggleFr,
  pickModule:pickModule, setFocus:setFocus, nextExercise:nextExercise, checkExercise:checkExercise, exitDrill:exitDrill,
  genReading:genReading, readAloud:readAloud, startQuestions:startQuestions, answerQuestion:answerQuestion, nextQuestion:nextQuestion, finishReading:finishReading, resetReading:resetReading,
  nb:function(t){ nbTab=t; renderNotebook(); }, startReview:startReview, reveal:reveal, grade:grade, exportAnki:exportAnki,
  saveSettings:function(){
    var k=document.getElementById("sKey").value.trim(), m=document.getElementById("sModel").value.trim(), g=parseInt(document.getElementById("sGoal").value,10);
    if(k) state.groqKey=k; if(m) state.model=m; if(g>=1&&g<=30) state.goal=g;
    state.speak=document.getElementById("sSpeak").checked; save();
    var b=document.getElementById("setbtn"); if(b){ var old=b.textContent; b.textContent="Enregistré ✓"; setTimeout(function(){ b.textContent=old; },1400); }
  },
  wipe:function(){ if(confirm("Effacer bilan, carnet, série et clé sur cet appareil ?")){ localStorage.removeItem(KEY); localStorage.removeItem(OLD2); localStorage.removeItem(OLD1);
    state={ groqKey:"", model:"openai/gpt-oss-120b", profile:null, notebook:{corrections:[],expressions:[]}, log:{}, goal:3, speak:true, stats:{conj:{r:0,w:0},gram:{r:0,w:0},voc:{r:0,w:0}} };
    scenario=null; messages=[]; convo=[]; ex={mod:null,focus:"Auto",item:null,phase:"idle",user:"",correct:null}; rd={theme:null,data:null,phase:"pick",answers:[],qi:0}; current="coach"; render(); } }
};
window.App=App;

/* ---------------- PWA ---------------- */
function installPWA(){
  try{
    var c=document.createElement("canvas"); c.width=180; c.height=180; var x=c.getContext("2d");
    x.fillStyle="#0F2E29"; x.fillRect(0,0,180,180); x.fillStyle="#E9B23C"; x.font="600 96px Georgia,serif"; x.textAlign="center"; x.textBaseline="middle"; x.fillText("E",90,98);
    var icon=c.toDataURL("image/png");
    var l=document.createElement("link"); l.rel="apple-touch-icon"; l.href=icon; document.head.appendChild(l);
    var manifest={ name:"English Coach", short_name:"English", start_url:".", display:"standalone", background_color:"#0F2E29", theme_color:"#0F2E29", icons:[{src:icon,sizes:"180x180",type:"image/png"}] };
    var ml=document.createElement("link"); ml.rel="manifest"; ml.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/json"})); document.head.appendChild(ml);
  }catch(e){}
}

/* ---------------- boot ---------------- */
function boot(){
  screenEl=document.getElementById("screen"); navEl=document.getElementById("nav");
  document.getElementById("hver").textContent=VERSION;
  Array.prototype.forEach.call(navEl.querySelectorAll("button"),function(b){
    b.addEventListener("click",function(){ var name=b.getAttribute("data-nav");
      if(name==="coach") scenario=null;
      if(name==="drill") exitDrill_soft();
      if(name==="reading" && rd.phase!=="pick"){ /* keep state */ }
      go(name);
    });
  });
  load(); loadVoices(); installPWA(); render();
}
function exitDrill_soft(){ /* keep last module selection but return to hub on tab tap */ ex.mod=null; ex.phase="idle"; }
boot();
</script>
</body>
